                h(TopBarActions.Button, { label: 'Khoá', disabled: true, onClick: () => setCount(999) }),
              ),
            ),
            h('output', { 'data-testid': 'count' }, String(count)),
          );
        }
        createRoot(document.getElementById('material-harness')).render(h(Controls));
      } else if (new URLSearchParams(location.search).has('aggregate')) {
        const { mountHarness } = await import('./appleUiHarness.tsx');
        mountHarness();
      } else createRoot(document.getElementById('material-harness')).render(
        React.createElement(ActionMenu, {
          title: 'Thao tác',
          'data-testid': 'menu-thu',
          items: [
            { id: 'share', label: 'Chia sẻ', icon: 'share', onSelect: () => {} },
            { id: 'download', label: 'Tải về', icon: 'download', onSelect: () => {} },
            { id: 'delete', label: 'Xoá', icon: 'delete', destructive: true, onSelect: () => {} },
          ],
        }),
      );
    </script>
  </body>
</html>
